<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEEPIFYS Social</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#06080d;color:#eef1f3;font-family:Inter,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 8%,rgba(255,80,170,.12),transparent 28%),radial-gradient(circle at 10% 90%,rgba(65,200,255,.08),transparent 30%)}
.top{height:70px;position:sticky;top:0;z-index:30;background:rgba(6,8,13,.84);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font:600 22px Georgia,serif;letter-spacing:.12em;color:#f1c982;text-decoration:none}.brand span{font:10px Arial;color:#8997a3;display:block;letter-spacing:.25em;margin-top:3px}.nav{display:flex;gap:18px;align-items:center}.nav a{color:#9ca8b2;text-decoration:none;font-size:11px;letter-spacing:.12em}.nav a:hover{color:#f1c982}.userbox button{border:1px solid rgba(241,201,130,.35);background:#10151c;color:#f1c982;border-radius:999px;padding:10px 15px;cursor:pointer;font-size:10px;letter-spacing:.1em}
.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:180px minmax(0,650px) 220px;gap:22px;padding:28px 20px}.side,.right{position:sticky;top:95px;height:max-content}.side a{display:block;color:#aab4bc;text-decoration:none;padding:13px 14px;border-radius:10px;font-size:11px;letter-spacing:.12em}.side a.active,.side a:hover{background:rgba(255,255,255,.05);color:#f1c982}.hero h1{font:500 42px Georgia,serif;margin:0 0 5px}.hero p{color:#85919a;font-size:12px;margin:0 0 22px}.card{background:rgba(12,16,22,.72);border:1px solid rgba(255,255,255,.09);border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 20px 55px rgba(0,0,0,.25)}
.compose{padding:18px;margin-bottom:16px}.compose textarea{width:100%;resize:none;background:transparent;border:0;outline:0;color:white;font-size:15px;line-height:1.5;min-height:70px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:12px}.row button,.primary{border:0;background:#edc580;color:#15120d;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:10px}.uploadBtn{border:1px solid #33404a!important;background:#0c1218!important;color:#dcb978!important}.preview{display:none;margin-top:12px;position:relative}.preview img{width:100%;max-height:330px;object-fit:cover;border-radius:13px;border:1px solid #28333b}.removeImg{position:absolute;right:9px;top:9px;border:0;background:rgba(0,0,0,.7);color:white;border-radius:50%;width:30px;height:30px;cursor:pointer}
.post{padding:18px;margin-bottom:13px}.posthead{display:flex;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#efc781,#6d3b66);color:#111;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.meta b{font-size:13px;cursor:pointer}.meta small{display:block;color:#687580;font-size:10px;margin-top:3px}.postbody{font-size:14px;line-height:1.6;color:#dbe0e3;margin:15px 0 12px;white-space:pre-wrap}.postimg{width:100%;max-height:560px;object-fit:cover;border-radius:14px;margin-top:8px;border:1px solid #27313a}.actions{display:flex;gap:18px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px;margin-top:12px}.actions button{background:none;border:0;color:#78858e;cursor:pointer;font-size:11px}.actions button:hover,.actions button.liked{color:#ef9ebd}.comments{margin-top:12px}.comment{padding:9px 0 0 18px;border-left:1px solid #29323a;font-size:11px;color:#aeb7bd}.comment .mini{display:inline-block;width:22px;height:22px;vertical-align:middle;margin-right:5px}.comment b{color:#e4c27f}.commentForm{display:flex;gap:7px;margin-top:10px}.commentForm input{flex:1;background:#0b1015;border:1px solid #27313a;border-radius:8px;padding:9px;color:white}.commentForm button{background:#dcb978;border:0;border-radius:8px;padding:0 11px;cursor:pointer}
.right .card{padding:16px}.right h3{font:500 18px Georgia;margin:0 0 13px;color:#f1c982}.right p{font-size:11px;line-height:1.6;color:#82909a}.tag{display:inline-block;padding:7px 9px;border:1px solid #29343c;border-radius:999px;color:#aeb8c0;font-size:9px;margin:3px}
.profile{padding:20px;margin-bottom:16px}.profileTop{display:flex;gap:15px;align-items:center}.profileAvatar{width:82px;height:82px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#efc781,#6d3b66);display:grid;place-items:center;color:#111;font-size:28px;font-weight:800}.profileAvatar img{width:100%;height:100%;object-fit:cover}.profileInfo h2{font:500 27px Georgia;margin:0;color:#f1c982}.profileInfo small{color:#77848e}.profileInfo p{font-size:12px;color:#aeb7bd;line-height:1.5}.stats{display:flex;gap:20px;margin-top:12px;font-size:11px;color:#8d9aa3}.stats b{color:#eee}.followBtn{margin-left:auto;border:1px solid #dcb978;background:#dcb978;color:#17130c;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:10px}.followBtn.following{background:transparent;color:#dcb978}.profileActions{display:flex;gap:8px;margin-top:15px}.profileActions button{background:#0d141a;border:1px solid #2a353d;color:#dcb978;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(420px,100%);padding:22px}.modal h2{font:500 27px Georgia;margin:0 0 15px;color:#f1c982}.field{width:100%;margin:6px 0;padding:12px;border-radius:9px;border:1px solid #2d3942;background:#0d1319;color:white}.primary.full{width:100%;margin-top:7px}.error{min-height:18px;color:#eaa1ad;font-size:11px;margin-top:8px}.search{display:flex;gap:7px}.search input{flex:1}.search button{border:1px solid #35404a;background:#0e141a;color:#dcb978;border-radius:9px;padding:0 12px;cursor:pointer}.result{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #202a31;cursor:pointer}.result small{display:block;color:#74818b}.result .avatar{width:34px;height:34px}
@media(max-width:850px){.wrap{grid-template-columns:1fr}.side,.right{display:none}.top{padding:0 14px}.nav{display:none}.hero h1{font-size:34px}}
</style></head><body>
<header class="top"><a href="/" class="brand">DEEPIFYS<span>SOCIAL / COMMUNITY</span></a><nav class="nav"><a href="/">SHOP</a><a href="/community.html">COMMUNITY</a></nav><div class="userbox"><button id="accountBtn">GİRİŞ YAP</button></div></header>
<main class="wrap"><aside class="side"><a class="active" href="/community.html">✦ ANA AKIŞ</a><a href="#" id="exploreLink">◇ KEŞFET</a><a href="#" id="popularLink">♡ POPÜLER</a><a href="#" id="myProfile">◉ PROFİL</a></aside>
<section><div id="view"></div></section>
<aside class="right"><div class="card"><h3>DEEPIFYS SOCIAL</h3><p>Takılarını, deneyimlerini ve favori tasarımlarını paylaş. İnsanları takip et, profilleri keşfet ve kendi akışını oluştur.</p><div><span class="tag">#velora</span><span class="tag">#miami</span><span class="tag">#jewelry</span></div></div><div class="card" style="margin-top:14px"><h3>İNSANLARI KEŞFET</h3><div class="search"><input id="searchInput" class="field" placeholder="Kullanıcı ara..."><button id="searchBtn">ARA</button></div><div id="searchResults"></div></div></aside></main>
<div class="modal" id="modal"><div class="modalbox card"><h2 id="modalTitle">Giriş Yap</h2><div id="loginFields"><input id="loginUser" class="field" placeholder="Kullanıcı adı"><input id="loginPass" class="field" type="password" placeholder="Şifre"><button class="primary full" id="loginBtn">GİRİŞ YAP</button></div><div id="registerFields" style="display:none"><input id="regName" class="field" placeholder="Görünen ad"><input id="regUser" class="field" placeholder="Kullanıcı adı"><input id="regPass" class="field" type="password" placeholder="Şifre (en az 6 karakter)"><button class="primary full" id="registerBtn">KAYIT OL</button></div><div class="error" id="authError"></div><div style="display:flex;justify-content:space-between;margin-top:14px"><button id="switchAuth" style="background:none;border:0;color:#dcb978;cursor:pointer;font-size:10px">Hesabın yok mu? Kayıt ol</button><button id="closeModal" style="background:none;border:0;color:#7e8a93;cursor:pointer;font-size:10px">KAPAT</button></div></div></div>
<input id="postImageInput" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let me=null,currentImage='';
async function auth(body){const r=await fetch('/api/social-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Hata');return d}
async function refresh(){try{const d=await auth({action:'me'});me=d.user;$('accountBtn').textContent=me?'@'+me.username:'GİRİŞ YAP';}catch{}}
function openAuth(reg=false){$('modal').classList.add('show');setMode(reg)}function setMode(reg){$('modalTitle').textContent=reg?'Kayıt Ol':'Giriş Yap';$('loginFields').style.display=reg?'none':'block';$('registerFields').style.display=reg?'block':'none';$('switchAuth').textContent=reg?'Zaten hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol';$('authError').textContent=''}
$('accountBtn').onclick=async()=>{if(me){await auth({action:'logout'});await refresh();loadHome()}else openAuth(false)};$('switchAuth').onclick=()=>setMode($('registerFields').style.display==='none');$('closeModal').onclick=()=>$('modal').classList.remove('show');
$('loginBtn').onclick=async()=>{try{await auth({action:'login',username:$('loginUser').value,password:$('loginPass').value});$('modal').classList.remove('show');await refresh();loadHome()}catch(e){$('authError').textContent=e.message}};
$('registerBtn').onclick=async()=>{try{await auth({action:'register',displayName:$('regName').value,username:$('regUser').value,password:$('regPass').value});$('modal').classList.remove('show');await refresh();loadHome()}catch(e){$('authError').textContent=e.message}};
function compress(file,max=1700,quality=.82){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function avatarHtml(p,cls='avatar'){return p.avatar?`<div class="${cls}"><img src="${p.avatar}" alt=""></div>`:`<div class="${cls}">${esc((p.displayName||'?')[0]).toUpperCase()}</div>`}
function composeHtml(){if(!me)return '';return `<div class="card compose"><textarea id="postText" maxlength="500" placeholder="Bugün DEEPIFYS hakkında ne düşünüyorsun?"></textarea><div class="preview" id="imgPreview"><img id="previewImg"><button class="removeImg" id="removeImg">×</button></div><div class="row"><div><button class="uploadBtn" id="chooseImg">📷 GÖRSEL EKLE</button><span style="font-size:9px;color:#687580;margin-left:7px">JPG / PNG / WEBP</span></div><button id="postBtn">PAYLAŞ</button></div><div class="error" id="postError"></div></div>`}
async function loadDirectory(mode){
  const title=mode==='popular'?'Popüler':'Keşfet';
  const desc=mode==='popular'?'En çok takip edilen ve en fazla etkileşim alan hesaplar.':'Yeni açılan hesapları burada keşfet.';
  $('view').innerHTML=`<div class="hero"><h1>${title}</h1><p>${desc}</p></div><div id="directory"><div style="color:#71808b;font-size:12px">Yükleniyor...</div></div>`;
  try{const r=await fetch('/api/social-profile?mode='+mode,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);
    $('directory').innerHTML=(d.users||[]).map(u=>`<div class="card profile" style="margin-bottom:12px"><div class="profileTop">${avatarHtml(u,'profileAvatar')}<div class="profileInfo"><h2 style="font-size:21px">${esc(u.displayName)}</h2><small>@${esc(u.username)}</small><p>${esc(u.bio||'Henüz bir bio eklenmemiş.')}</p><div class="stats"><span><b>${u.followersCount}</b> takipçi</span><span><b>${u.posts}</b> gönderi</span><span><b>${u.likes}</b> beğeni</span><span><b>${u.comments}</b> yorum</span></div></div><button class="followBtn" onclick="openProfile('${esc(u.username)}')">PROFİL</button></div></div>`).join('')||'<div style="color:#71808b;font-size:12px">Henüz kullanıcı yok.</div>';
  }catch(e){$('directory').innerHTML='<div style="color:#eaa1ad;font-size:12px">Liste yüklenemedi: '+esc(e.message)+'</div>'}
}
window.loadDirectory=loadDirectory;

async function loadHome(){const v=$('view');v.innerHTML=`<div class="hero"><h1>Community</h1><p>İnsanları keşfet, takip et, paylaş ve kendi akışını oluştur.</p></div>${composeHtml()}<div id="feed"><div style="color:#71808b;font-size:12px">Akış yükleniyor...</div></div>`;bindCompose();loadFeed()}
function bindCompose(){if(!me)return;$('chooseImg').onclick=()=>$('postImageInput').click();$('postImageInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{currentImage=await compress(f);$('previewImg').src=currentImage;$('imgPreview').style.display='block'}catch{$('postError').textContent='Görsel okunamadı.'}};$('removeImg').onclick=()=>{currentImage='';$('postImageInput').value='';$('imgPreview').style.display='none'};$('postBtn').onclick=async()=>{try{const r=await fetch('/api/social-posts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'create',text:$('postText').value,image:currentImage})});const d=await r.json();if(!r.ok)throw Error(d.error);currentImage='';loadHome()}catch(e){$('postError').textContent=e.message}}}
async function loadFeed(){try{const r=await fetch('/api/social-posts',{cache:'no-store'}),d=await r.json();renderPosts(d.posts||[])}catch{$('feed').innerHTML='<div style="color:#eaa1ad;font-size:12px">Akış yüklenemedi.</div>'}}
function renderPosts(posts){$('feed').innerHTML=posts.map(p=>`<article class="card post" id="${p.id}"><div class="posthead">${avatarHtml({displayName:p.displayName,avatar:p.avatar})}<div class="meta"><b onclick="openProfile('${esc(p.username)}')">${esc(p.displayName)}</b><small>@${esc(p.username)} · ${new Date(p.createdAt).toLocaleDateString('tr-TR')}</small></div></div>${p.text?`<div class="postbody">${esc(p.text)}</div>`:''}${p.image?`<img class="postimg" src="${p.image}" alt="Gönderi görseli" loading="lazy">`:''}<div class="actions"><button class="${me&&p.likes?.includes(me.username)?'liked':''}" onclick="act('like','${p.id}')">♡ ${p.likes?.length||0}</button><button onclick="document.getElementById('comment-${p.id}')?.focus()">💬 ${p.comments?.length||0}</button><button onclick="navigator.clipboard?.writeText(location.origin+location.pathname+'#${p.id}')">↗ PAYLAŞ</button></div><div class="comments">${(p.comments||[]).slice(-5).map(c=>`<div class="comment">${avatarHtml({displayName:c.displayName,avatar:c.avatar},'avatar mini')}<b>${esc(c.displayName)}</b> — ${esc(c.text)}</div>`).join('')}${me?`<div class="commentForm"><input id="comment-${p.id}" placeholder="Yorum yaz..."><button onclick="act('comment','${p.id}',document.getElementById('comment-${p.id}').value)">↗</button></div>`:''}</div></article>`).join('')||'<div style="color:#71808b;font-size:12px">Henüz paylaşım yok. İlk paylaşımı sen yap.</div>'}
async function act(action,id,text=''){if(!me){openAuth(false);return}const r=await fetch('/api/social-posts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,id,text})});const d=await r.json();if(!r.ok){alert(d.error);return}loadFeed()}
window.act=act;
async function openProfile(username){const r=await fetch('/api/social-profile?username='+encodeURIComponent(username));const d=await r.json();if(!r.ok){alert(d.error);return}renderProfile(d.profile,d.posts,d.me)}window.openProfile=openProfile;
function renderProfile(p,posts,meUser){const following=meUser&&p.followers.includes(meUser);$('view').innerHTML=`<div class="card profile"><div class="profileTop">${avatarHtml(p,'profileAvatar')}<div class="profileInfo"><h2>${esc(p.displayName)}</h2><small>@${esc(p.username)}</small><p>${esc(p.bio||'Henüz bir bio eklenmemiş.')}</p><div class="stats"><span><b>${p.followers.length}</b> takipçi</span><span><b>${p.following.length}</b> takip</span><span><b>${posts.length}</b> gönderi</span></div></div>${meUser&&meUser!==p.username?`<button class="followBtn ${following?'following':''}" onclick="followUser('${esc(p.username)}')">${following?'TAKİPTEN ÇIK':'TAKİP ET'}</button>`:''}</div>${meUser===p.username?`<div class="profileActions"><button onclick="editProfile()">PROFİLİ DÜZENLE</button><button onclick="loadHome()">ANA AKIŞ</button></div>`:''}</div><div id="feed">${posts.length?posts.map(x=>`<article class="card post"><div class="posthead">${avatarHtml(p)}<div class="meta"><b>${esc(p.displayName)}</b><small>@${esc(p.username)} · ${new Date(x.createdAt).toLocaleDateString('tr-TR')}</small></div></div>${x.text?`<div class="postbody">${esc(x.text)}</div>`:''}${x.image?`<img class="postimg" src="${x.image}" alt="">`:''}<div class="actions"><button class="${me&&x.likes?.includes(me.username)?'liked':''}" onclick="act('like','${x.id}')">♡ ${x.likes?.length||0}</button><button>💬 ${x.comments?.length||0}</button></div></article>`).join(''):'<div style="color:#71808b;font-size:12px">Henüz gönderi yok.</div>'}</div>`}
window.followUser=async username=>{if(!me){openAuth(false);return}const r=await fetch('/api/social-profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'follow',username})});const d=await r.json();if(!r.ok){alert(d.error);return}openProfile(username)};
window.editProfile=async()=>{const r=await fetch('/api/social-profile?username='+encodeURIComponent(me.username)),d=await r.json();$('view').innerHTML=`<div class="card profile"><h2 style="font:500 27px Georgia;color:#f1c982;margin-top:0">Profili Düzenle</h2><input id="editName" class="field" maxlength="32" value="${esc(d.profile.displayName)}" placeholder="Görünen ad"><textarea id="editBio" class="field" rows="3" maxlength="160" placeholder="Kendinden bahset">${esc(d.profile.bio||'')}</textarea><div style="display:flex;align-items:center;gap:12px;margin:10px 0">${avatarHtml(d.profile,'profileAvatar')}<button class="profileActions" style="margin:0" id="avatarBtn">PROFİL FOTOĞRAFI SEÇ</button></div><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" style="display:none"><div class="error" id="editError"></div><button class="primary" id="saveProfile">KAYDET</button></div>`;$('avatarBtn').onclick=()=>$('avatarInput').click();let av=d.profile.avatar||'';$('avatarInput').onchange=async e=>{const f=e.target.files?.[0];if(f)av=await compress(f,700,.82)};$('saveProfile').onclick=async()=>{try{const r=await fetch('/api/social-profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'update',displayName:$('editName').value,bio:$('editBio').value,avatar:av})});const x=await r.json();if(!r.ok)throw Error(x.error);await refresh();openProfile(me.username)}catch(e){$('editError').textContent=e.message}}};
$('myProfile').onclick=e=>{e.preventDefault();if(me)openProfile(me.username);else openAuth(false)};
$('exploreLink').onclick=e=>{e.preventDefault();loadDirectory('explore')};
$('popularLink').onclick=e=>{e.preventDefault();loadDirectory('popular')};
$('searchBtn').onclick=async()=>{const q=$('searchInput').value.trim();if(!q){$('searchResults').innerHTML='';return}const r=await fetch('/api/social-profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'search',query:q})});const d=await r.json();$('searchResults').innerHTML=(d.users||[]).map(u=>`<div class="result" onclick="openProfile('${esc(u.username)}')">${avatarHtml(u)}<div><b>${esc(u.displayName)}</b><small>@${esc(u.username)} · ${u.followers} takipçi</small></div></div>`).join('')||'<div style="color:#71808b;font-size:11px;padding-top:10px">Kullanıcı bulunamadı.</div>'};
refresh().then(loadHome);
</script></body></html>
